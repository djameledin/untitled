name: Tailscale Nodes
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
    - cron: '5 15 * * *'

jobs:
  Node:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: Download & Install Tailscale
        shell: pwsh
        run: |
          $msiPath = "$env:TEMP\tailscale.msi"
          $ProgressPreference = 'SilentlyContinue'
          
          Write-Host "Starting download..."
          curl.exe -L "https://pkgs.tailscale.com/stable/tailscale-setup-1.98.2-amd64.msi" -o $msiPath
          
          Write-Host "Download finished. Installing..."
          Start-Process msiexec.exe -ArgumentList "/i $msiPath /quiet /norestart" -Wait
          Write-Host "Tailscale Installed"

      - name: Maintain Connection & Show Info
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --reset --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="exit-node" --advertise-exit-node
          Write-Host "Tailscale Connected"
          Write-Host " "
          
          $totalIterations = 24
          for ($i = 1; $i -le $totalIterations; $i++) {
              $percent = [math]::Round(($i / $totalIterations) * 100)
              Write-Progress -Activity "Workflow Active" -Status "Computing on your computer" -PercentComplete $percent
              Start-Sleep -Seconds 900
              Write-Host "Tailscale node is still ongoing ($percent)"
          }
          & $ts logout
          Write-Host "This Session Completed Successfully."
