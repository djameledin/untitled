name: Ubuntu environment

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
    - uses: actions/checkout@v3

    - name: Optimize Network & CPU Performance
      run: |
        sudo sysctl -w net.core.rmem_max=16777216
        sudo sysctl -w net.core.wmem_max=16777216
        sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 16777216"
        sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 16777216"
        sudo sysctl -w net.core.default_qdisc=fq
        sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
        
        echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
        echo 'Acquire::Languages "none";' | sudo tee /etc/apt/apt.conf.d/99disable-languages
        echo 'APT::Install-Recommends "false";' | sudo tee /etc/apt/apt.conf.d/99synaptic
        
        sudo apt-get update
        sudo apt-get install -y pigz pixz pbzip2 curl wget
        sudo ln -sf /usr/bin/pigz /usr/bin/gzip
        sudo ln -sf /usr/bin/pixz /usr/bin/xz

    - name: Install GNOME Desktop & xrdp
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q xrdp xorgxrdp gdm3 gnome-shell gnome-session gnome-terminal gsettings-desktop-schemas dbus-x11 x11-xserver-utils
        
        sudo mkdir -p /etc/xrdp
        echo "allowed_users=anybody" | sudo tee /etc/xrdp/Xwrapper.config
        
        sudo systemctl enable xrdp
        sudo systemctl restart xrdp

    - name: Configure Root User & Install Tailscale
      run: |
        MY_PASS="${{ secrets.PASSWORD }}"
        if [ -z "$MY_PASS" ]; then
          exit 1
        fi
        
        echo "root:$MY_PASS" | sudo chpasswd
        sudo hostname "ubuntu-desktop"
        
        sudo sed -i 's/allowed_users=console/allowed_users=anybody/g' /etc/X11/Xwrapper.config || true
        
        echo "gnome-session" | sudo tee /root/.xsession > /dev/null
        echo "export GNOME_SHELL_SESSION_MODE=ubuntu" | sudo tee /root/.xprofile > /dev/null
        echo "export XDG_CURRENT_DESKTOP=Ubuntu:GNOME" | sudo tee -a /root/.xprofile > /dev/null
        
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Connect Tailscale & Maintain Connection
      run: |
        sudo tailscale up --reset --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="ubuntu"
        
        for i in {1..10}; do
           IP=$(tailscale ip -4)
           if [ ! -z "$IP" ]; then break; fi
           sleep 3
        done
        
        if [ -z "$IP" ]; then
           exit 1
        fi
        
        echo "IP: $IP"
        
        TOTAL_ITERATIONS=22
        for i in $(seq 1 $TOTAL_ITERATIONS); do
            sleep 900
            echo "Loop $i"
        done
        
        sudo tailscale logout
