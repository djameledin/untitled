name: Ubuntu environment with xrdp (Gnome Minimal)
on:
  workflow_dispatch:

jobs:
  This-PC:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Optimize Network & CPU Performance
        run: |
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 16777216"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 16777216"
          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
          
          sudo apt-get update
          sudo apt-get install -y pigz pixz pbzip2
          
          sudo ln -sf /usr/bin/pigz /usr/bin/gzip
          sudo ln -sf /usr/bin/pixz /usr/bin/xz

      - name: Update System & Install Gnome Minimal & xrdp
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xrdp xorgxrdp gnome-session gnome-terminal gsettings-desktop-schemas \
            dbus-x11 x11-xserver-utils
          
          echo "export GNOME_SHELL_SESSION_MODE=ubuntu" > ~/.xprofile
          echo "export XDG_CURRENT_DESKTOP=Ubuntu:GNOME" >> ~/.xprofile
          echo "export XDG_DATA_DIRS=/usr/share/ubuntu:/usr/local/share:/usr/share" >> ~/.xprofile
          echo "export XDG_CONFIG_DIRS=/etc/xdg/xdg-ubuntu:/etc/xdg" >> ~/.xprofile
          echo "gnome-session" >> ~/.xprofile
          
          cp ~/.xprofile ~/.xsession
          
          sudo sed -i 's/test -x \/etc\/X11\/Xsession \&\& exec \/etc\/X11\/Xsession/exec gnome-session/g' /etc/xrdp/startwm.sh
          
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Configure default runneradmin user
        run: |
          USERNAME="runneradmin"
          PASSWORD="${{ secrets.PASSWORD }}"
          
          sudo useradd -m -s /bin/bash $USERNAME
          echo "$USERNAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo $USERNAME
          
          sudo cp ~/.xprofile /home/$USERNAME/.xprofile
          sudo cp ~/.xsession /home/$USERNAME/.xsession
          sudo chown -R $USERNAME:$USERNAME /home/$USERNAME/.xprofile /home/$USERNAME/.xsession
          
          echo "USER_NAME=$USERNAME" >> $GITHUB_ENV
          echo "USER_PASS=$PASSWORD" >> $GITHUB_ENV

      - name: Download & Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Maintain Connection & Show Info
        run: |
          sudo tailscale up --reset --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="debian"

          IP=$(tailscale ip -4)
          if [ -z "$IP" ]; then exit 1; fi
          
          PASS_LEN=${#USER_PASS}
          STARS=$(printf '*%.0s' $(seq 1 $PASS_LEN))

          echo "The Virtual Machine with this IP($IP) is ready!"
          echo "Username: $USER_NAME ; Password: $STARS"
          echo "You can now connect using any RDP client on port 3389"
          echo " "

          TOTAL_ITERATIONS=22
          for i in $(seq 1 $TOTAL_ITERATIONS); do
              PERCENT=$(( (i * 100) / TOTAL_ITERATIONS ))
              echo "Workflow Active: Computing on your computer ($PERCENT%)"
              sleep 900
              echo "This session is still running at $(date +'%H:%M') (Loop $i of $TOTAL_ITERATIONS)"
          done
          
          sudo tailscale logout
