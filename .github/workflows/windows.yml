name: Windows environment
on:
  workflow_dispatch:

jobs:
  This-PC:
    runs-on: windows-2022
    timeout-minutes: 340
    steps:
      - name: Configure default runneradmin user
        shell: pwsh
        run: |
          $username = "runneradmin"
          $password = "${{ secrets.PASSWORD }}"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          Set-LocalUser -Name $username -Password $securePass
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          
          echo "USERNAME=$username" >> $env:GITHUB_ENV
          echo "PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "User account provisioning completed successfully."
          
      - name: Install Tailscale
        shell: pwsh
        run: |
          $msiPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.98.2-amd64.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i $msiPath /quiet /norestart" -Wait

      - name: Initialize Windows
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope LocalMachine -ExecutionPolicy Bypass
          iex (Invoke-WebRequest "https://raw.githubusercontent.com/djameledin/untitled/refs/heads/main/actions.ps1").Content
          iex (Invoke-WebRequest "https://raw.githubusercontent.com/djameledin/untitled/refs/heads/main/theme.ps1").Content

      - name: Maintain Connection & Show Info
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --reset --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="virtualmachine"
          Write-Host "Tailscale Connected"

          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          if (-not $ip) { exit 1 }
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          
          Write-Host "The Virtual Machine with this IP($env:TAILSCALE_IP) is ready!"
          Write-Host "Username: $env:USERNAME ; Password: $('*' * $env:PASSWORD.Length)"

          $endTime = (Get-Date).AddHours(5).AddMinutes(30)
          while ((Get-Date) -lt $endTime) {
              Write-Progress -Activity "Workflow Active" -Status "Computing on your computer" -PercentComplete 0
              Start-Sleep -Seconds 900
              Write-Host "This session is still running at $(Get-Date -Format 'HH:mm')"
          }

          Write-Host "This Session Completed Successfully."
