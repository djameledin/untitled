name: Windows Environment

on:
  workflow_dispatch:

jobs:
  This-PC:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:

      # ----------------------------------------
      # Create Standard User
      # ----------------------------------------

      - name: Configure User
        shell: pwsh
        run: |

          $username = "standarduser"
          $password = "${{ secrets.PASSWORD }}"

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Create user if not exists
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {

              New-LocalUser `
                -Name $username `
                -Password $securePass `
                -FullName $username `
                -Description "Interactive Desktop User"

              Write-Host "User created."
          }
          else {

              Set-LocalUser `
                -Name $username `
                -Password $securePass

              Write-Host "User updated."
          }

          # Never expire password
          Set-LocalUser `
            -Name $username `
            -PasswordNeverExpires $true

          # Add permissions
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Export variables
          echo "USERNAME=$username" >> $env:GITHUB_ENV
          echo "PASSWORD=$password" >> $env:GITHUB_ENV

      # ----------------------------------------
      # Enable RDP + Optimize Session
      # ----------------------------------------

      - name: Configure RDP
        shell: pwsh
        run: |

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          # Disable first login animation
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" `
            /v EnableFirstLogonAnimation `
            /t REG_DWORD `
            /d 0 `
            /f

          # Disable lock screen
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization" `
            /v NoLockScreen `
            /t REG_DWORD `
            /d 1 `
            /f

          # Disable privacy setup
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\OOBE" `
            /v DisablePrivacyExperience `
            /t REG_DWORD `
            /d 1 `
            /f

          # Disable sleep
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0

          Write-Host "RDP configured."

      # ----------------------------------------
      # Download PsExec
      # ----------------------------------------

      - name: Download PsExec
        shell: pwsh
        run: |

          Invoke-WebRequest `
            https://download.sysinternals.com/files/PSTools.zip `
            -OutFile "$env:TEMP\pstools.zip"

          Expand-Archive `
            "$env:TEMP\pstools.zip" `
            "$env:TEMP\pstools"

          echo "$env:TEMP\pstools" >> $env:GITHUB_PATH

      # ----------------------------------------
      # Install Tailscale
      # ----------------------------------------

      - name: Install Tailscale
        shell: pwsh
        run: |

          Invoke-WebRequest `
            https://pkgs.tailscale.com/stable/tailscale-setup-1.92.3-amd64.msi `
            -OutFile "$env:TEMP\tailscale.msi"

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" `
            -Wait

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --reset `
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" `
            --hostname=virtualmachine

          Write-Host "Tailscale connected."

          # Get IP
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

          if (-not $ip) {
              Write-Error "No Tailscale IP found."
              exit 1
          }

          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      # ----------------------------------------
      # Start Interactive Desktop Session
      # ----------------------------------------

      - name: Start Explorer Session
        shell: cmd
        run: |

          psexec.exe -accepteula ^
          -i ^
          -u .\standarduser ^
          -p ${{ secrets.PASSWORD }} ^
          explorer.exe

      # ----------------------------------------
      # Initialize Desktop
      # ----------------------------------------

      - name: Initialize Windows
        shell: pwsh
        run: |

          $rawUrl = "https://raw.githubusercontent.com/djameledin/untitled/main/untitled.ps1"

          $tmpFile = "$env:TEMP\untitled.ps1"

          Invoke-WebRequest `
            -Uri $rawUrl `
            -OutFile $tmpFile

          $username = ".\standarduser"
          $password = "${{ secrets.PASSWORD }}"

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $credential = New-Object `
            System.Management.Automation.PSCredential(
              $username,
              $securePass
            )

          Start-Process `
            powershell.exe `
            -Credential $credential `
            -ArgumentList "-ExecutionPolicy Bypass -File `"$tmpFile`"" `
            -Wait

      # ----------------------------------------
      # Show Connection Info
      # ----------------------------------------

      - name: Connection Info
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "RDP READY"
          Write-Host "======================================="
          Write-Host ""
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "USERNAME: $env:USERNAME"
          Write-Host "PASSWORD LENGTH: $($env:PASSWORD.Length)"
          Write-Host ""
          Write-Host "Use mstsc to connect."
          Write-Host ""

      # ----------------------------------------
      # Keep Alive
      # ----------------------------------------

      - name: Keep Alive
        shell: pwsh
        run: |

          $endTime = (Get-Date).AddHours(5).AddMinutes(30)

          while ((Get-Date) -lt $endTime) {

              Start-Sleep -Seconds 300

              $currentTime = Get-Date -Format "HH:mm:ss"

              Write-Host ""
              Write-Host "Session Active [$currentTime]"
          }

          Write-Host "Workflow finished."
