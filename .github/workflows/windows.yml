name: Windows environment
on:
  workflow_dispatch:

jobs:
  This-PC:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: Configure default runneradmin user
        shell: pwsh
        run: |
          $username = "standarduser"
          $password = "${{ secrets.PASSWORD }}"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          # Create user as Administrator first
          New-LocalUser -Name $username -Password $securePass -FullName "Standard User" -Description "Standard user for GitHub Actions" -ErrorAction SilentlyContinue
          
          # Add to Administrators group initially
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Users" -Member $username -ErrorAction SilentlyContinue
          
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          
          echo "USERNAME=$username" >> $env:GITHUB_ENV
          echo "PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "Admin user account created with RDP enabled successfully."

      - name: Install & Connect Tailscale
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://pkgs.tailscale.com/stable/tailscale-setup-1.92.3-amd64.msi `
            -OutFile $env:TEMP\tailscale.msi
            
          Start-Process msiexec.exe `
            -ArgumentList "/i $env:TEMP\tailscale.msi /quiet /norestart" `
            -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --reset `
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" `
            --hostname=virtualmachine
          Write-Host "Tailscale Connected"
          
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          if (-not $ip) { exit 1 }
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Initialize Windows
        shell: pwsh
        run: |
          $rawUrl = "https://raw.githubusercontent.com/djameledin/untitled/master/untitled.ps1"
          $code = (Invoke-WebRequest -Uri $rawUrl -UseBasicParsing).Content
          
          $tmpFile = "C:\Users\Public\untitled.ps1"
          $code | Out-File -FilePath $tmpFile -Encoding UTF8 -Force
          
          $username = "standarduser"
          $password = "${{ secrets.PASSWORD }}"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($username, $securePass)
          Start-Process powershell -Credential $credential -ArgumentList "-Command exit" -LoadUserProfile -WindowStyle Hidden -Wait -ErrorAction SilentlyContinue
          
          schtasks /Create /TN "InitScript" /TR "PowerShell.exe -ExecutionPolicy Bypass -File `"$tmpFile`"" /SC ONCE /ST 00:00 /RU "$username" /RP "$password" /F | Out-Null
          schtasks /Run /TN "InitScript" | Out-Null
          
          Write-Host "Waiting for script to complete under standarduser..."
          Start-Sleep -Seconds 5
          do {
              Start-Sleep -Seconds 3
              $state = schtasks /Query /TN "InitScript" /FO LIST 2>$null | Select-String "Status" | ForEach-Object { $_ -replace ".*:\s*", "" }
          } while ($state -match "Running")
          
          Write-Host "Script execution completed under standarduser"
          schtasks /Delete /TN "InitScript" /F | Out-Null
          
          # تحويل المستخدم إلى Standard بعد انتهاء الـ script
          Remove-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Write-Host "User downgraded to Standard successfully."

      - name: Maintain Connection & Show Info
        shell: pwsh
        run: |
          Write-Host "The Virtual Machine with this IP($env:TAILSCALE_IP) is ready!"
          Write-Host "Username: $env:USERNAME ; Password: $('*' * $env:PASSWORD.Length)"

          $endTime = (Get-Date).AddHours(5).AddMinutes(30)
          while ((Get-Date) -lt $endTime) {
              Start-Sleep -Seconds 600
              Write-Progress -Activity "Workflow Active" -Status "Computing on your computer" -PercentComplete 0
              
              Start-Sleep -Seconds 300
              $currentTime = Get-Date -Format "HH:mm"
              Write-Host " "
              Write-Host "This session is still running at [ $currentTime ]"
          }

          Write-Host "This Session Completed Successfully."
