name: Windows RDP Ready

on:
  workflow_dispatch:

jobs:
  pc:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:

      - name: Setup User + RDP
        shell: pwsh
        run: |
          $u="standarduser"
          $p="${{ secrets.PASSWORD }}"
          $s=ConvertTo-SecureString $p -AsPlainText -Force

          if(-not(Get-LocalUser $u -ea 0)){
            New-LocalUser $u -Password $s
          } else {
            Set-LocalUser $u -Password $s
          }

          Add-LocalGroupMember "Administrators" $u -ea 0
          Add-LocalGroupMember "Remote Desktop Users" $u -ea 0

          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Warm Profile (fix gray screen)
        shell: pwsh
        run: |
          $u="standarduser"
          $p="${{ secrets.PASSWORD }}"
          $s=ConvertTo-SecureString $p -AsPlainText -Force
          $c=New-Object PSCredential(".\$u",$s)

          Start-Process "cmd.exe" -Credential $c -ArgumentList "/c exit" -Wait

      - name: Enable Login Script
        shell: pwsh
        run: |
          $u="standarduser"
          $p="${{ secrets.PASSWORD }}"
          $path="C:\ProgramData\init.ps1"

          Invoke-WebRequest "https://raw.githubusercontent.com/djameledin/untitled/main/untitled.ps1" -OutFile $path

          $a=New-ScheduledTaskAction "powershell.exe" "-ExecutionPolicy Bypass -File `"$path`""
          $t=New-ScheduledTaskTrigger -AtLogOn -User $u

          Register-ScheduledTask RunOnRDPLogin -Action $a -Trigger $t -User $u -Password $p -RunLevel Highest -Force

      - name: Tailscale
        shell: pwsh
        run: |
          Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-1.92.3-amd64.msi -OutFile $env:TEMP\t.msi
          Start-Process msiexec.exe "/i $env:TEMP\t.msi /quiet /norestart" -Wait

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname=vm

          $ip=&"$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "IP=$ip" >> $env:GITHUB_ENV

      - name: Info
        shell: pwsh
        run: |
          Write-Host "RDP READY"
          Write-Host $env:IP
          Write-Host "user: standarduser"
